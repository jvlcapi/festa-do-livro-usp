[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "festa-do-livro-usp"
version = "0.1.0"
description = "Catálogo de preços da Festa do Livro da USP gerado a partir das listas das editoras"
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.28.2",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
